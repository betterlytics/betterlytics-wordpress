name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '**/*.txt'
      - '.distignore'
      - '.gitignore'
      - '.editorconfig'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '**/*.txt'
      - '.distignore'
      - '.gitignore'
      - '.editorconfig'

jobs:
  lint:
    name: PHP Lint (PHPCS)
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run PHPCS via Docker Compose
        run: docker compose --profile lint run --rm lint

  test:
    name: PHP Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run PHPUnit via Docker Compose
        run: docker compose --profile test run --rm test

      - name: Cleanup
        if: always()
        run: docker compose --profile test down -v

  build:
    name: Build Plugin
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build plugin zip via Docker Compose
        run: docker compose --profile build run --rm build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: betterlytics-plugin
          path: build/betterlytics.zip
