services:
  # ===================
  # Development
  # ===================
  wordpress:
    image: wordpress:latest
    ports:
      - "${WORDPRESS_PORT:-8888}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      WORDPRESS_DEBUG: 1
    volumes:
      - wordpress_data:/var/www/html
      - .:/var/www/html/wp-content/plugins/betterlytics
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - betterlytics

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress}
      MYSQL_USER: ${MYSQL_USER:-wordpress}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - betterlytics

  # One-time WordPress setup (runs after WordPress is healthy)
  setup:
    image: wordpress:cli
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
    volumes:
      - wordpress_data:/var/www/html
      - .:/var/www/html/wp-content/plugins/betterlytics
    depends_on:
      wordpress:
        condition: service_healthy
    networks:
      - betterlytics
    command: >
      sh -c '
        if ! wp core is-installed --allow-root 2>/dev/null; then
          echo "Installing WordPress..." &&
          wp core install \
            --url="http://localhost:${WORDPRESS_PORT:-8888}" \
            --title="Betterlytics Dev" \
            --admin_user=admin \
            --admin_password=admin \
            --admin_email=admin@example.com \
            --skip-email \
            --allow-root &&
          echo "Activating Betterlytics plugin..." &&
          wp plugin activate betterlytics --allow-root &&
          echo "WordPress setup complete!"
        else
          echo "WordPress already installed."
        fi
      '

  # ===================
  # Linting
  # ===================
  lint:
    image: composer:latest
    volumes:
      - .:/app
    working_dir: /app
    command: sh -c "composer install && vendor/bin/phpcs"
    profiles:
      - lint

  lint-fix:
    image: composer:latest
    volumes:
      - .:/app
    working_dir: /app
    command: sh -c "composer install && vendor/bin/phpcbf"
    profiles:
      - lint-fix

  # ===================
  # Testing
  # ===================
  db-test:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: wordpress_test
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_test_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - betterlytics
    profiles:
      - test

  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    volumes:
      - .:/var/www/html/wp-content/plugins/betterlytics
      - /var/www/html/wp-content/plugins/betterlytics/vendor
      - phpunit_cache:/tmp/wordpress-tests-lib
    depends_on:
      db-test:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db-test
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress_test
      WP_TESTS_DIR: /tmp/wordpress-tests-lib
      WP_PHPUNIT__DIR: /tmp/wordpress-tests-lib
    networks:
      - betterlytics
    profiles:
      - test

  # ===================
  # Build
  # ===================
  build:
    image: alpine:latest
    volumes:
      - .:/app
      - ./build:/app/build
    working_dir: /app
    command:
      - sh
      - -c
      - |
        apk add --no-cache zip &&
        mkdir -p build &&
        zip -r build/betterlytics.zip . \
          -x ".git/*" \
          -x ".git*" \
          -x ".github/*" \
          -x "vendor/*" \
          -x "tests/*" \
          -x "bin/*" \
          -x "build/*" \
          -x "demo/*" \
          -x "docker-compose.yml" \
          -x "Dockerfile*" \
          -x "Makefile" \
          -x "phpunit.xml*" \
          -x "phpcs.xml*" \
          -x "composer.*" \
          -x ".editorconfig" \
          -x ".env*" \
          -x "*.md" \
          -x ".agent/*" \
          -x ".claude/*" &&
        echo "Build complete: build/betterlytics.zip"
    profiles:
      - build

  # ===================
  # Demo (WooCommerce integration testing)
  # ===================
  demo-setup:
    image: wordpress:cli
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
    volumes:
      - wordpress_data:/var/www/html
      - .:/var/www/html/wp-content/plugins/betterlytics
      - ./demo/mu-plugins:/var/www/html/wp-content/mu-plugins
    depends_on:
      wordpress:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    networks:
      - betterlytics
    profiles:
      - demo
    command: >
      sh -c '
        echo "Setting up demo environment..." &&

        # Install and activate WooCommerce
        if ! wp plugin is-installed woocommerce 2>/dev/null; then
          echo "Installing WooCommerce..." &&
          wp plugin install woocommerce --activate
        else
          echo "WooCommerce already installed, activating..." &&
          wp plugin activate woocommerce 2>/dev/null || true
        fi &&

        # Run WooCommerce setup wizard pages (skip actual wizard)
        wp option update woocommerce_store_address "123 Demo Street" &&
        wp option update woocommerce_store_city "Demo City" &&
        wp option update woocommerce_default_country "US:CA" &&
        wp option update woocommerce_store_postcode "90210" &&
        wp option update woocommerce_currency "USD" &&
        wp option update woocommerce_product_type "both" &&
        wp option update woocommerce_allow_tracking "no" &&
        wp option update --format=json woocommerce_onboarding_profile "{\"skipped\":true}" &&

        # Create WooCommerce pages if they do not exist
        wp option update woocommerce_queue_flush_rewrite_rules "yes" &&

        # Create a demo product using raw post creation (wp wc requires REST API)
        PRODUCT_COUNT=$$(wp post list --post_type=product --format=count) &&
        if [ "$$PRODUCT_COUNT" -eq "0" ]; then
          echo "Creating demo product..." &&
          PRODUCT_ID=$$(wp post create \
            --post_type=product \
            --post_title="Demo Product" \
            --post_name="demo-product" \
            --post_status=publish \
            --post_content="A demo product for testing Betterlytics events." \
            --post_excerpt="Demo product for testing." \
            --porcelain) &&
          wp post meta update $$PRODUCT_ID _price "19.99" &&
          wp post meta update $$PRODUCT_ID _regular_price "19.99" &&
          wp post meta update $$PRODUCT_ID _stock_status "instock" &&
          wp post meta update $$PRODUCT_ID _visibility "visible" &&
          echo "Created product ID: $$PRODUCT_ID"
        else
          echo "Demo product already exists."
        fi &&

        # Create a demo page for testing custom events
        if ! wp post list --post_type=page --name=betterlytics-test --format=ids | grep -q .; then
          echo "Creating test page..." &&
          wp post create \
            --post_type=page \
            --post_title="Betterlytics Test Page" \
            --post_name="betterlytics-test" \
            --post_status=publish \
            --post_content="<!-- This page content is rendered by the betterlytics-demo mu-plugin -->"
        else
          echo "Test page already exists."
        fi &&

        # Configure Betterlytics plugin from demo/config.json
        echo "Configuring Betterlytics plugin..." &&
        wp option update betterlytics_options --format=json < /var/www/html/wp-content/plugins/betterlytics/demo/config.json &&

        echo "Demo setup complete!"
      '

volumes:
  wordpress_data:
  db_data:
  db_test_data:
  phpunit_cache:

networks:
  betterlytics:
