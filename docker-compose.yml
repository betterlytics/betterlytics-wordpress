services:
  # ===================
  # Development
  # ===================
  wordpress:
    image: wordpress:latest
    ports:
      - "${WORDPRESS_PORT:-8888}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      WORDPRESS_DEBUG: 1
    volumes:
      - wordpress_data:/var/www/html
      - .:/var/www/html/wp-content/plugins/betterlytics
      - ./demo/mu-plugins:/var/www/html/wp-content/mu-plugins
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - betterlytics

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress}
      MYSQL_USER: ${MYSQL_USER:-wordpress}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - betterlytics

  # One-time WordPress setup (runs after WordPress is healthy)
  setup:
    image: wordpress:cli
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
    volumes:
      - wordpress_data:/var/www/html
      - .:/var/www/html/wp-content/plugins/betterlytics
    depends_on:
      wordpress:
        condition: service_healthy
    networks:
      - betterlytics
    command: >
      sh -c '
        if ! wp core is-installed --allow-root 2>/dev/null; then
          echo "Installing WordPress..." &&
          wp core install \
            --url="http://localhost:${WORDPRESS_PORT:-8888}" \
            --title="Betterlytics Dev" \
            --admin_user=admin \
            --admin_password=admin \
            --admin_email=admin@example.com \
            --skip-email \
            --allow-root &&
          echo "Activating Betterlytics plugin..." &&
          wp plugin activate betterlytics --allow-root &&
          echo "WordPress setup complete!"
        else
          echo "WordPress already installed."
        fi
      '

  # ===================
  # Linting
  # ===================
  lint:
    image: composer:latest
    volumes:
      - .:/app
    working_dir: /app
    command: sh -c "composer install && vendor/bin/phpcs"
    profiles:
      - lint

  lint-fix:
    image: composer:latest
    volumes:
      - .:/app
    working_dir: /app
    command: sh -c "composer install && vendor/bin/phpcbf"
    profiles:
      - lint-fix

  # ===================
  # Testing
  # ===================
  db-test:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: wordpress_test
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_test_data:/var/lib/mysql
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - betterlytics
    profiles:
      - test

  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    volumes:
      - .:/var/www/html/wp-content/plugins/betterlytics
      - /var/www/html/wp-content/plugins/betterlytics/vendor
      - phpunit_cache:/tmp/wordpress-tests-lib
    depends_on:
      db-test:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db-test
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress_test
      WP_TESTS_DIR: /tmp/wordpress-tests-lib
      WP_PHPUNIT__DIR: /tmp/wordpress-tests-lib
    networks:
      - betterlytics
    profiles:
      - test

  # ===================
  # Plugin Check (WordPress.org validation)
  # ===================
  plugin-check:
    image: wordpress:cli
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
    volumes:
      - wordpress_data:/var/www/html
      - .:/var/www/html/wp-content/plugins/betterlytics
    depends_on:
      wordpress:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    networks:
      - betterlytics
    profiles:
      - plugin-check
    command: >
      sh -c '
        echo "Installing Plugin Check..." &&
        wp plugin install plugin-check --activate &&
        echo "" &&
        echo "Running Plugin Check on betterlytics..." &&
        echo "========================================" &&
        wp plugin check betterlytics \
          --fields=code,type,message,file,line \
          --format=table
      '

  # ===================
  # Build
  # ===================
  build:
    image: alpine:latest
    volumes:
      - .:/app
      - ./build:/app/build
    working_dir: /app
    command:
      - sh
      - -c
      - |
        apk add --no-cache zip &&
        mkdir -p build &&
        zip -r build/betterlytics.zip . \
          -x ".git/*" \
          -x ".git*" \
          -x ".github/*" \
          -x "vendor/*" \
          -x "tests/*" \
          -x "bin/*" \
          -x "build/*" \
          -x "demo/*" \
          -x "docker-compose.yml" \
          -x "Dockerfile*" \
          -x "Makefile" \
          -x "phpunit.xml*" \
          -x "phpcs.xml*" \
          -x "composer.*" \
          -x ".editorconfig" \
          -x ".env*" \
          -x "*.md" \
          -x ".agent/*" \
          -x ".claude/*" &&
        echo "Build complete: build/betterlytics.zip"
    profiles:
      - build

  # ===================
  # Demo (Integration Testing)
  # ===================
  demo-setup:
    image: wordpress:cli
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
    volumes:
      - wordpress_data:/var/www/html
      - .:/var/www/html/wp-content/plugins/betterlytics
      - ./demo/mu-plugins:/var/www/html/wp-content/mu-plugins
    depends_on:
      wordpress:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    networks:
      - betterlytics
    profiles:
      - demo
    command: >
      sh -c '
        echo "Setting up demo environment..." &&

        # Enable pretty permalinks
        echo "Enabling pretty permalinks..." &&
        wp rewrite structure "/%postname%/" --hard &&
        wp rewrite flush --hard &&

        # Create a demo page for testing custom events
        if ! wp post list --post_type=page --name=betterlytics-test --format=ids | grep -q .; then
          echo "Creating test page..." &&
          wp post create \
            --post_type=page \
            --post_title="Betterlytics Test Page" \
            --post_name="betterlytics-test" \
            --post_status=publish \
            --post_content="<!-- This page content is rendered by the betterlytics-demo mu-plugin -->"
        else
          echo "Test page already exists."
        fi &&

        # Configure Betterlytics plugin from demo/config.json
        echo "Configuring Betterlytics plugin..." &&
        wp option update betterlytics_options --format=json < /var/www/html/wp-content/plugins/betterlytics/demo/config.json &&

        echo "Demo setup complete!"
      '

volumes:
  wordpress_data:
  db_data:
  db_test_data:
  phpunit_cache:

networks:
  betterlytics:
